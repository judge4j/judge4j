name: Release

# Publishes a release when you push a version tag:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Job 1 needs no secrets: it builds, tests, and attaches the jars to a GitHub Release.
# Job 2 publishes to Maven Central and runs only when the Central secrets exist (see CONTRIBUTING.md).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  github-release:
    name: Build, test and create the GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # The version comes from the tag (v0.1.0 -> 0.1.0); nothing is committed back.
      - name: Set the version from the tag
        run: ./mvnw -B -q versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      # Runs every unit test, then builds the jars with sources and Javadoc (unsigned here).
      # judge4j-examples is a demo application and is never released.
      - name: Test and package
        shell: bash
        run: ./mvnw -B -Prelease -Dgpg.skip=true verify -pl '!judge4j-examples' 2>&1 | tee build.log

      - name: Explain the failure
        if: failure()
        shell: bash
        run: |
          grep -E "ERROR|FAILURE|Could not|Connection|Exception|Tests run:.*(Failures: [1-9]|Errors: [1-9])" build.log \
            | head -30 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: judge4j-*/target/judge4j-*.jar

  maven-central:
    name: Publish to Maven Central
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      # Secrets cannot be tested in a job-level condition, so check here and skip the rest if absent.
      - name: Check that Central credentials are configured
        id: creds
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$CENTRAL_USERNAME" ] && [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Maven Central secrets are not configured; skipping the Central publish."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.configured == 'true'

      - uses: actions/setup-java@v5
        if: steps.creds.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set the version from the tag
        if: steps.creds.outputs.configured == 'true'
        run: ./mvnw -B -q versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      # Tests already passed in the first job. This signs the jars and uploads them to the Central Portal.
      - name: Deploy
        if: steps.creds.outputs.configured == 'true'
        shell: bash
        run: ./mvnw -B -Prelease -DskipTests deploy -pl '!judge4j-examples' 2>&1 | tee deploy.log
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # Job logs need a signed-in session; annotations are public. Show what Central said either way.
      - name: Explain the failure
        if: failure() && steps.creds.outputs.configured == 'true'
        shell: bash
        run: |
          grep -E "ERROR|FAILURE|Could not|Connection|Exception|Unauthorized|errors|warnings" deploy.log \
            | head -30 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Show the Central deployment status
        if: success() && steps.creds.outputs.configured == 'true'
        shell: bash
        run: |
          grep -iE "deployment|validated|validating|published|central" deploy.log \
            | head -12 | while IFS= read -r line; do echo "::notice::${line}"; done

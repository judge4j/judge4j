name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Live-model evaluations are excluded from the default build, so no API keys are needed.
      - name: Build and test
        run: ./mvnw -B verify

  packaging:
    name: Release packaging check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Release readiness (secrets, license)
        run: scripts/check-release-ready.sh
      - name: Build sources and Javadoc jars (unsigned)
        run: ./mvnw -B -Prelease -Dgpg.skip=true -DskipTests package
